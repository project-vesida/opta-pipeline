# opta-pipeline CI: lint, type-check, and the fast test suites.
#
# core     — installs the package with NO optional extras and runs the tests
#            that survive without opta-model (proves the runtime is standalone).
# full     — installs [dev] (opta-model for synthetic frames, video extras,
#            xdist) pinned via constraints.txt and runs the whole fast suite.
#            --dist loadfile keeps module-scoped synth fixtures on one worker.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -U pip && python -m pip install . pytest -c constraints.txt
      - name: Runtime imports without opta-model
        run: |
          python -c "import opta_pipeline, opta_pipeline.tdm, opta_pipeline.ingest_video; from opta_pipeline.config import PipelineConfig; PipelineConfig.default()"
          python -c "import sys; assert 'opta_model' not in sys.modules"
      - name: Core-only tests
        run: python -m pytest tests -q -p no:cacheprovider

  full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      - name: Install opta-model (from source until the release is on PyPI)
        run: |
          python -m pip install -U pip
          python -m pip install "opta-model @ git+https://github.com/project-vesida/opta-model@main" -c constraints.txt
      - run: python -m pip install -e '.[dev]' -c constraints.txt
      - run: ruff check src tests examples
      - run: pyright
      - name: Fast test suite (xdist, loadfile)
        run: python -m pytest tests -q -m "not slow" -n 4 --dist loadfile -p no:cacheprovider
      - name: Smoke example
        run: python examples/smoke.py | tee smoke.out && grep -q "detected=True" smoke.out
